name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v1
      with:
        version: "latest"
    - uses: actions/setup-python@v4
      with:
        python-version: "3.13"
    - run: uv sync --dev
    - name: Unit tests (offline)
      run: uv run pytest -v tests/test_audio.py tests/test_lyria.py tests/test_context.py tests/test_tags.py tests/test_web_api.py
