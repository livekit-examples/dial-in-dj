<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="1400" height="820" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .card { fill: #ffffff; stroke-width: 2; }
      .num { font-size: 15px; font-weight: 800; fill: #ffffff; }
      .t { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .b { font-size: 14.5px; fill: #1e293b; }
      .q { font-size: 14.5px; font-style: italic; fill: #7c2d12; }
      .who { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; }
      .time { font-size: 12.5px; font-weight: 700; fill: #475569; }
      .flow { stroke: #94a3b8; stroke-width: 3; fill: none; }
    </style>
  </defs>
  <rect width="1400" height="820" fill="#f8fafc"/>
  <text x="700" y="46" text-anchor="middle" font-size="30" font-weight="800" fill="#0f172a">A call to the Dial-in DJ, step by step</text>
  <text x="700" y="74" text-anchor="middle" font-size="15" fill="#475569">What the caller experiences, and what happens behind the scenes at each step</text>

  <!-- Row 1 -->
  <!-- 1 -->
  <rect x="30" y="110" width="310" height="300" rx="16" class="card" stroke="#22d3ee"/>
  <circle cx="62" cy="142" r="18" fill="#0891b2"/><text x="62" y="147" text-anchor="middle" class="num">1</text>
  <text x="92" y="148" class="who" fill="#0e7490">THE CALLER</text>
  <text x="185" y="210" text-anchor="middle" font-size="46">📱</text>
  <text x="185" y="252" text-anchor="middle" class="t">Dials the number</text>
  <text x="185" y="278" text-anchor="middle" class="b">Any phone works. No app,</text>
  <text x="185" y="298" text-anchor="middle" class="b">no sign-up.</text>
  <line x1="50" y1="322" x2="320" y2="322" stroke="#e2e8f0"/>
  <text x="50" y="346" class="time">BEHIND THE SCENES</text>
  <text x="50" y="370" class="b">LiveKit answers and opens a</text>
  <text x="50" y="390" class="b">private room just for this call.</text>

  <!-- 2 -->
  <rect x="370" y="110" width="310" height="300" rx="16" class="card" stroke="#fb923c"/>
  <circle cx="402" cy="142" r="18" fill="#ea580c"/><text x="402" y="147" text-anchor="middle" class="num">2</text>
  <text x="432" y="148" class="who" fill="#c2410c">THE DJ</text>
  <text x="600" y="148" class="time">≈ 5 seconds</text>
  <text x="525" y="210" text-anchor="middle" font-size="46">🤖🎶</text>
  <text x="525" y="252" text-anchor="middle" class="t">Says hi, music starts</text>
  <text x="525" y="278" text-anchor="middle" class="b">A relaxed deep-house groove</text>
  <text x="525" y="298" text-anchor="middle" class="b">fades in under the DJ's voice.</text>
  <line x1="390" y1="322" x2="660" y2="322" stroke="#e2e8f0"/>
  <text x="390" y="346" class="time">BEHIND THE SCENES</text>
  <text x="390" y="370" class="b">The DJ joins the room and asks</text>
  <text x="390" y="390" class="b">Google's Lyria to start composing.</text>

  <!-- 3 -->
  <rect x="710" y="110" width="310" height="300" rx="16" class="card" stroke="#22d3ee"/>
  <circle cx="742" cy="142" r="18" fill="#0891b2"/><text x="742" y="147" text-anchor="middle" class="num">3</text>
  <text x="772" y="148" class="who" fill="#0e7490">THE CALLER</text>
  <text x="865" y="210" text-anchor="middle" font-size="46">🗣️</text>
  <text x="865" y="252" text-anchor="middle" class="t">Asks for something</text>
  <text x="865" y="278" text-anchor="middle" class="q">"Give me some funky disco</text>
  <text x="865" y="298" text-anchor="middle" class="q">with a saxophone!"</text>
  <line x1="730" y1="322" x2="1000" y2="322" stroke="#e2e8f0"/>
  <text x="730" y="346" class="time">BEHIND THE SCENES</text>
  <text x="730" y="370" class="b">The music dips so the caller is</text>
  <text x="730" y="390" class="b">heard clearly over it.</text>

  <!-- 4 -->
  <rect x="1050" y="110" width="320" height="300" rx="16" class="card" stroke="#fb923c"/>
  <circle cx="1082" cy="142" r="18" fill="#ea580c"/><text x="1082" y="147" text-anchor="middle" class="num">4</text>
  <text x="1112" y="148" class="who" fill="#c2410c">THE DJ</text>
  <text x="1270" y="148" class="time">≈ 1 second</text>
  <text x="1210" y="210" text-anchor="middle" font-size="46">🧠</text>
  <text x="1210" y="252" text-anchor="middle" class="t">Understands and confirms</text>
  <text x="1210" y="278" text-anchor="middle" class="q">"Bringing the disco."</text>
  <text x="1210" y="298" text-anchor="middle" class="b">A few words, then it gets out of the way.</text>
  <line x1="1070" y1="322" x2="1350" y2="322" stroke="#e2e8f0"/>
  <text x="1070" y="346" class="time">BEHIND THE SCENES</text>
  <text x="1070" y="370" class="b">It turns the words into music tags:</text>
  <text x="1070" y="390" class="b">disco · alto saxophone · funky.</text>

  <!-- snake connector row1 -> row2 -->
  <path d="M340,260 L368,260" class="flow" marker-end="url(#ah)"/>
  <path d="M680,260 L708,260" class="flow" marker-end="url(#ah)"/>
  <path d="M1020,260 L1048,260" class="flow" marker-end="url(#ah)"/>
  <path d="M1210,410 L1210,440 L1210,440" class="flow"/>
  <path d="M1210,440 C1210,460 1190,462 1170,462 L1150,462" class="flow" marker-end="url(#ah)"/>

  <!-- Row 2 (right to left) -->
  <!-- 5 -->
  <rect x="840" y="470" width="310" height="300" rx="16" class="card" stroke="#a78bfa"/>
  <circle cx="872" cy="502" r="18" fill="#7c3aed"/><text x="872" y="507" text-anchor="middle" class="num">5</text>
  <text x="902" y="508" class="who" fill="#6d28d9">LYRIA (GOOGLE)</text>
  <text x="1080" y="508" class="time">≈ 2–4 s</text>
  <text x="995" y="570" text-anchor="middle" font-size="46">🎷🪩</text>
  <text x="995" y="612" text-anchor="middle" class="t">The music morphs</text>
  <text x="995" y="638" text-anchor="middle" class="b">Disco with a sax blends in</text>
  <text x="995" y="658" text-anchor="middle" class="b">smoothly, no hard cut.</text>
  <line x1="860" y1="682" x2="1130" y2="682" stroke="#e2e8f0"/>
  <text x="860" y="706" class="time">BEHIND THE SCENES</text>
  <text x="860" y="730" class="b">Lyria composes new music live and</text>
  <text x="860" y="750" class="b">streams it back through LiveKit.</text>

  <!-- 6 -->
  <rect x="500" y="470" width="310" height="300" rx="16" class="card" stroke="#22d3ee"/>
  <circle cx="532" cy="502" r="18" fill="#0891b2"/><text x="532" y="507" text-anchor="middle" class="num">6</text>
  <text x="562" y="508" class="who" fill="#0e7490">THE CALLER</text>
  <text x="655" y="570" text-anchor="middle" font-size="46">🎛️</text>
  <text x="655" y="612" text-anchor="middle" class="t">Keeps steering</text>
  <text x="655" y="638" text-anchor="middle" class="q">"Make it sadder." "Faster!"</text>
  <text x="655" y="658" text-anchor="middle" class="q">"Drop the drums… bring them back."</text>
  <line x1="520" y1="682" x2="790" y2="682" stroke="#e2e8f0"/>
  <text x="520" y="706" class="time">BEHIND THE SCENES</text>
  <text x="520" y="730" class="b">Steps 3–5 repeat for every request.</text>
  <text x="520" y="750" class="b">Side chatter in the room is ignored.</text>

  <!-- 7 -->
  <rect x="160" y="470" width="310" height="300" rx="16" class="card" stroke="#22d3ee"/>
  <circle cx="192" cy="502" r="18" fill="#0891b2"/><text x="192" y="507" text-anchor="middle" class="num">7</text>
  <text x="222" y="508" class="who" fill="#0e7490">THE CALLER</text>
  <text x="315" y="570" text-anchor="middle" font-size="46">👋</text>
  <text x="315" y="612" text-anchor="middle" class="t">Hangs up</text>
  <text x="315" y="638" text-anchor="middle" class="b">That's it. Every call gets its</text>
  <text x="315" y="658" text-anchor="middle" class="b">own one-of-a-kind music.</text>
  <line x1="180" y1="682" x2="450" y2="682" stroke="#e2e8f0"/>
  <text x="180" y="706" class="time">BEHIND THE SCENES</text>
  <text x="180" y="730" class="b">The room closes and the music</text>
  <text x="180" y="750" class="b">session with Lyria shuts down.</text>

  <path d="M838,620 L812,620" class="flow" marker-end="url(#ah)"/>
  <path d="M498,620 L472,620" class="flow" marker-end="url(#ah)"/>
  <!-- loop arrow on step 6 back to step 3 -->
  <path d="M655,468 C655,440 865,440 865,414" class="flow" stroke-dasharray="6 6" marker-end="url(#ah)"/>
  <text x="885" y="446" class="time">↺ repeat any time</text>

  <!-- key -->
  <circle cx="44" cy="796" r="7" fill="#0891b2"/><text x="58" y="801" class="b">the caller</text>
  <circle cx="164" cy="796" r="7" fill="#ea580c"/><text x="178" y="801" class="b">the AI DJ (runs on LiveKit Cloud)</text>
  <circle cx="440" cy="796" r="7" fill="#7c3aed"/><text x="454" y="801" class="b">Lyria music generator (Google)</text>
  <text x="1370" y="801" text-anchor="end" class="time">Times are approximate</text>
</svg>
